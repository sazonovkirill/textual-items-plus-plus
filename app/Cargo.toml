[package]
name = "textual-items-plus-plus"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "tipp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
ratatui = "0.30.2"
unicode-segmentation = "1.13.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
cognitive_complexity = "warn"

[dev-dependencies]
proptest = "1.11.0"
termlens = "0.11.4"
