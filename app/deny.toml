# Dependency policy from docs/code-quality.md (Toolchain and dependencies).

[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    { crate = "serial_test", reason = "tests always run in parallel (docs/testing-strategy.md, Parallel execution)" },
]
skip = [
    { crate = "hashbrown@0.16.1", reason = "kasuari, under ratatui-core 0.1, still uses hashbrown 0.16" },
    { crate = "syn@2.0.119", reason = "derive_more (crossterm) and strum_macros (ratatui) still use syn 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
