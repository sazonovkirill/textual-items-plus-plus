# The Reference page each command, window and setting of the app is listed on
# (specs/website.md, W-REF-03). `bash site/site.sh reference` fails on one the app has and this
# map does not place, and on a name here the app does not have, so a new command, window or
# setting needs a line here. Commands are named by their registry title, windows by the heading
# the keymap window gives their keys, and settings by their config.toml key.

